<div class="page-container">
  <div class="form-container">
    <div class="header">
      <h2 class="titulo-form">Órdenes de representantes</h2>
      <div class="header-actions">
        <button mat-stroked-button type="button" (click)="changePassword()">Cambiar contraseña</button>
      </div>
    </div>

    <section class="identity-grid" aria-label="Datos del representante">
      <div class="readonly-field">
        <label>Nombre del operador</label>
        <div class="value">{{ nombreOperador }}</div>
      </div>

      <div class="readonly-field">
        <label>Correo corporativo</label>
        <div class="value">{{ correoCorporativo }}</div>
      </div>

      <div>
        @if (codigosCliente.length <= 1) {
          <div class="readonly-field">
            <label>Código de cliente</label>
            <div class="value">{{ codigoClienteSeleccionado }}</div>
          </div>
        } @else {
          <label class="field-label">Código de cliente</label>
          <mat-form-field appearance="fill" class="client-select">
            <mat-select [(ngModel)]="codigoClienteSeleccionado" [disabled]="enviando">
              @for (code of codigosCliente; track code) {
                <mat-option [value]="code">{{ code }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        }
      </div>
    </section>

    <app-order-form
      [markets]="markets"
      marketControl="radio"
      [submitting]="enviando"
      (orderSubmitted)="submitOrder($event)"
      (cancelled)="backToLogin()" />
  </div>
</div>
