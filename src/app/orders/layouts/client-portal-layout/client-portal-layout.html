<div class="portal-layout">
  <header class="mobile-header">
    <a class="mobile-brand" [routerLink]="ordersRoute" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">OO</span>
      <span>Órdenes Online</span>
    </a>
    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="menuOpen"
      aria-controls="portal-navigation"
      aria-label="Abrir menú"
      (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
  </header>

  <aside id="portal-navigation" class="sidebar" [class.open]="menuOpen">
    <a class="brand" [routerLink]="ordersRoute" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">OO</span>
      <span>
        <strong>Órdenes Online</strong>
        <small>{{ portalLabel }}</small>
      </span>
    </a>

    <nav class="main-navigation" aria-label="Navegación del portal">
      <span class="nav-label">Operaciones</span>

      <a
        [routerLink]="ordersRoute"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>Nueva orden</span>
      </a>

      @if (trackingRoute; as route) {
        <a
          [routerLink]="route"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5.5h16M4 12h16M4 18.5h10" />
            <circle cx="18" cy="18.5" r="2" />
          </svg>
          <span>Mis órdenes</span>
        </a>
      }
    </nav>

    <div class="account-section">
      <span class="nav-label">Cuenta</span>

      <div class="client-summary">
        <span class="avatar" aria-hidden="true">{{ accountInitial }}</span>
        <span>
          <strong>{{ accountLabel }}</strong>
          <small>{{ accountEmail }}</small>
        </span>
      </div>

      <a
        class="account-action"
        [routerLink]="accountPasswordRoute"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2" />
        </svg>
        <span>Cambiar contraseña</span>
      </a>

      <button class="account-action logout-button" type="button" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9" />
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  @if (menuOpen) {
    <button class="menu-backdrop" type="button" aria-label="Cerrar menú" (click)="closeMenu()"></button>
  }

  <main class="portal-content">
    <router-outlet></router-outlet>
  </main>
</div>
